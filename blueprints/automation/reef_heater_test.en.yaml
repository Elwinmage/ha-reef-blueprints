# Generated by scripts/gen_heater_test.py -- do not edit by hand.
# Edit the strings in that script and run gen_blueprints.py again.
blueprint:
  name: Reef heater test (en) — v1.3.0
  description: >
    Periodically proves that each heater can hold the tank on its own: one heater stays powered, the others are cut for the duration of the test, and the result is sent to your phone. The test stops early and restores every heater if the temperature falls, and heaters left off by a restart are turned back on. Needs at least two heaters.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  homeassistant:
    min_version: "2024.8.0"
  input:
    equipment_section:
      name: Equipment
      icon: mdi:heating-coil
      input:
        heaters:
          name: Heaters
          description: >
            The switches powering the heaters. They are all expected to be on outside a test, and any heater found off after a restart is turned back on: to take one out of service, remove it from this list.
          selector:
            entity:
              domain: switch
              multiple: true
        temperature_sensors:
          name: Temperature sensors
          description: >
            Probes in the water. The median is used, so with three probes a single faulty one cannot change the verdict.
          selector:
            entity:
              domain: sensor
              multiple: true

    schedule_section:
      name: Schedule
      icon: mdi:calendar-clock
      input:
        test_time:
          name: Start time
          description: >
            Avoid a test that overlaps a change of lighting or fan speed: either one moves the temperature by itself.
          default: "09:00:00"
          selector:
            time: {}
        cycle_days:
          name: Days between tests
          description: >
            One heater is tested each time, in turn. With two heaters and 14 days, each heater is tested every four weeks.
          default: 14
          selector:
            number:
              min: 1
              max: 60
              mode: box
        test_duration:
          name: Test duration
          description: >
            A large volume reacts slowly: under about two hours, a heater that does nothing can go unnoticed.
          default: 240
          selector:
            number:
              min: 30
              max: 720
              step: 30
              unit_of_measurement: min
              mode: slider

    safety_section:
      name: Safety
      icon: mdi:shield-alert-outline
      input:
        max_drop:
          name: Allowed temperature drop
          description: >
            Beyond this drop from the starting temperature the test fails and stops at once. Keep it above the resolution of your probes.
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 2
              step: 0.1
              unit_of_measurement: "°"
              mode: slider
        abort_temperature:
          name: Abort temperature
          description: >
            Below this value no test starts, and a running test stops and restores the heaters.
          default: 24.5
          selector:
            number:
              min: 15
              max: 30
              step: 0.1
              unit_of_measurement: "°"
              mode: box
        pause_entities:
          name: Maintenance entities (optional)
          description: >
            While any of these is on, no test starts and heaters are not turned back on, since they may be out of the water. They are restored when it goes off.
          default: []
          selector:
            entity:
              multiple: true

    measure_section:
      name: Measurement and history
      icon: mdi:flash
      collapsed: true
      input:
        room_sensor:
          name: Room temperature (optional)
          description: >
            Skips the test when the room is at or above the tank or the setpoint: the heater would have nothing to do, and the test would prove nothing. Strongly advised, above all without a power meter.
          default: ""
          selector:
            entity:
              domain: sensor
        heater_setpoint:
          name: Heater setpoint (optional)
          description: >
            The temperature set on the heater's thermostat, 0 if unknown. Also skips the test when the tank is already above it.
          default: 0
          selector:
            number:
              min: 0
              max: 35
              step: 0.1
              unit_of_measurement: "°"
              mode: box
        power_sensors:
          name: Power sensors (optional)
          description: >
            Filled in automatically for a Red Sea socket or a smart plug: leave empty. Only needed when the meter is on another device, and then give one sensor per heater, in the same order as the list of heaters.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: power
              multiple: true
        power_threshold:
          name: Consumption threshold
          description: >
            Above this value a heater counts as drawing power, at or below it as not drawing. Keep it above the standby reading of the meter.
          default: 10
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: W
              mode: box
        result_entity:
          name: Last result (optional)
          description: >
            A text helper that receives the date and the result of each run. Its history keeps the earlier ones. Give it a maximum length of 255.
          default: ""
          selector:
            entity:
              domain: input_text

    notify_section:
      name: Notifications
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Mobile devices to notify
          description: >
            Receive the result of each test. Only phones and tablets registered through the Home Assistant app are listed.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Android channel (optional)
          description: >
            Channel name passed in `data.channel`. Leave empty for the default channel. iOS ignores this field.
          default: "Reef"
          selector:
            text:

mode: single
max_exceeded: silent

trigger:
  - platform: time
    at: !input test_time
    id: schedule
  - platform: event
    event_type: reef_heater_test
    id: manual
  - platform: homeassistant
    event: start
    id: startup
  - platform: event
    event_type: automation_reloaded
    id: reload
  - platform: state
    entity_id: !input pause_entities
    to: "off"
    id: pause_end

variables:
  heaters: !input heaters
  temperature_sensors: !input temperature_sensors
  test_time: !input test_time
  cycle_days: !input cycle_days
  test_duration: !input test_duration
  max_drop: !input max_drop
  abort_temperature: !input abort_temperature
  pause_entities: !input pause_entities
  room_sensor: !input room_sensor
  heater_setpoint: !input heater_setpoint
  power_sensors: !input power_sensors
  power_threshold: !input power_threshold
  result_entity: !input result_entity
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  # automation.trigger (the Run button) has no trigger id.
  trigger_id: "{{ trigger.id | default('manual') }}"
  day_number: "{{ now().toordinal() }}"
  # Guarded by the id: `trigger.event` is the string "start" on the
  # homeassistant trigger, and an error here would stop the recovery run.
  requested: >-
    {{ trigger.event.data.heater | default('')
       if trigger.id | default('') == 'manual' else '' }}

condition:
  - alias: "Today is a test day"
    condition: template
    value_template: >-
      {{ trigger_id != 'schedule' or day_number % (cycle_days | int) == 0 }}
  - alias: "A manual request is aimed at this instance"
    condition: template
    value_template: "{{ requested == '' or requested in heaters }}"
  - alias: "A reload can only have killed a test that had started"
    condition: template
    value_template: >-
      {{ trigger_id != 'reload'
         or now().timestamp() - as_timestamp(this.attributes.last_triggered, 0)
            < (test_duration | int + 5) * 60 }}

action:
  # Integrations are still loading when Home Assistant reports it has started.
  - delay: "{{ 120 if trigger_id == 'startup' else 0 }}"

  - alias: "Find the meter and the mode of each heater"
    variables:
      # The list given by hand wins, for a relay in series with a meter that
      # sits on another device. A socket's mode comes with its role.
      links: >-
        {%- set ns = namespace(items=[]) -%}
        {%- set manual = power_sensors
              if power_sensors | count == heaters | count else [] -%}
        {%- for h in heaters -%}
          {%- set role = state_attr(h, 'reef_role') or '' -%}
          {%- set prefix = role[:-7] if role.endswith('_on_off') else '' -%}
          {%- set d = device_id(h) -%}
          {%- set ents = device_entities(d) if d else [] -%}
          {%- set own = (ents | select('is_state_attr', 'reef_role',
                prefix ~ '_consumption') | list) if prefix else [] -%}
          {%- set meters = ents | select('match', 'sensor[.]')
                | select('is_state_attr', 'device_class', 'power') | list -%}
          {%- set meter = own[0] if own
                else meters[0] if meters | count == 1 and not prefix
                else '' -%}
          {%- set modes = (ents | select('is_state_attr', 'reef_role',
                prefix ~ '_mode') | list) if prefix else [] -%}
          {%- set ns.items = ns.items + [{
            'heater': h,
            'power': manual[loop.index0] if manual else meter,
            'mode': modes[0] if modes else '',
          }] -%}
        {%- endfor -%}
        {{ ns.items }}
      # A socket following a probe or a schedule is regulated by the strip:
      # `standby` reads as off although nothing is wrong, and forcing it would
      # take the regulation away.
      driven_heaters: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for l in links if l.mode and states(l.mode) not in ['on', 'off'] -%}
          {%- set ns.items = ns.items + [l.heater] -%}
        {%- endfor -%}
        {{ ns.items }}

  - alias: "Check whether a test can start"
    variables:
      is_test: "{{ trigger_id in ['schedule', 'manual'] }}"
      started_at: "{{ now().timestamp() }}"
      start_temp: >-
        {{ temperature_sensors | map('states') | select('is_number')
           | map('float') | list | median(none) }}
      paused_at_start: >-
        {{ pause_entities | select('is_state', 'on') | list | count > 0 }}
      room_temp: >-
        {{ states(room_sensor) | float(none) if room_sensor != '' else none }}
      # In summer a heater has nothing to do: its thermostat stays open, the
      # tank does not move, and a test would pass, or give no verdict, without
      # having proved anything. The room is compared to the lower of the tank
      # and the setpoint, because the tank usually sits above the room. A tank
      # already past the setpoint keeps the thermostat open just as well,
      # hence the second test, beyond the drop allowed for a normal swing.
      no_demand: >-
        {%- set ref = ([start_temp, heater_setpoint | float]
              if heater_setpoint | float > 0 else [start_temp]) | min
              if start_temp is number else none -%}
        {{ ref is number and (
             (room_temp is number and room_temp >= ref)
             or (heater_setpoint | float > 0
                 and start_temp > heater_setpoint | float + max_drop)) }}
      skip_reason: >-
        {%- if not is_test -%}
        {%- elif heaters | count < 2 -%} too_few
        {%- elif power_sensors | count not in [0, heaters | count] -%} power_list
        {%- elif paused_at_start -%} paused
        {%- elif start_temp is not number -%} no_temperature
        {%- elif start_temp < abort_temperature -%} too_cold
        {%- elif no_demand -%} no_demand
        {%- elif driven_heaters | count > 0 -%} driven
        {%- elif heaters | reject('is_state', 'on') | list | count > 0 -%} heater_off
        {%- endif -%}
      run_test: "{{ is_test and skip_reason == '' }}"
      target: >-
        {%- if not run_test -%}
        {%- elif requested != '' -%} {{ requested }}
        {%- else -%}
          {%- set offset = 0 if trigger_id == 'schedule' else 1 -%}
          {{ heaters[(day_number // (cycle_days | int) + offset) % (heaters | count)] }}
        {%- endif -%}
      to_cut: "{{ heaters | reject('eq', target) | list if run_test else [] }}"
      target_name: "{{ state_attr(target, 'friendly_name') or target }}"
      target_power: >-
        {{ (links | selectattr('heater', 'eq', target)
            | map(attribute='power') | list + [''])[0] }}
      # Read before the cut: a heater idling on its own thermostat draws
      # nothing either way, so only one that was drawing proves its relay.
      drawing_before: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for l in links
              if l.power and states(l.power) | float(0) > power_threshold -%}
          {%- set ns.items = ns.items + [l.heater] -%}
        {%- endfor -%}
        {{ ns.items }}
      # Long enough for a polled meter: the RS Power refreshes once a minute.
      settle: >-
        {{ 180 if links | selectattr('heater', 'in', to_cut)
           | selectattr('power') | list | count > 0 else 0 }}

  - if:
      - "{{ run_test }}"
    then:
      - service: switch.turn_off
        target:
          entity_id: "{{ to_cut }}"

  - alias: "Let the meters catch up with the cut"
    delay: "{{ settle }}"

  - alias: "Check that the relays really opened"
    variables:
      cut_report: >-
        {%- set ns = namespace(stuck=[], proven=[], unproven=[]) -%}
        {%- for l in links if l.power and l.heater in to_cut -%}
          {%- set name = state_attr(l.heater, 'friendly_name') or l.heater -%}
          {%- if states(l.power) | float(0) > power_threshold -%}
            {%- set ns.stuck = ns.stuck + [name] -%}
          {%- elif l.heater in drawing_before -%}
            {%- set ns.proven = ns.proven + [name] -%}
          {%- else -%}
            {%- set ns.unproven = ns.unproven + [name] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'stuck': ns.stuck, 'proven': ns.proven, 'unproven': ns.unproven} }}
      relay_stuck: "{{ cut_report.stuck | count > 0 }}"
      heat_at_start: >-
        {{ target_power != '' and states(target_power) | float(0) > power_threshold }}

  # A template trigger fires on an edge, so a heater already drawing is
  # settled by heat_at_start above and this wait only runs until the timeout.
  - alias: "Hold the test until the heater proves itself, or something goes wrong"
    wait_for_trigger:
      - platform: template
        id: heat_seen
        value_template: >-
          {{ target_power != ''
             and states(target_power) | float(0) > power_threshold }}
      - platform: template
        id: too_cold
        value_template: >-
          {% set t = temperature_sensors | map('states') | select('is_number')
             | map('float') | list | median(none) %}
          {{ t is number and t < abort_temperature }}
        for: "00:02:00"
      - platform: template
        id: dropped
        value_template: >-
          {% set t = temperature_sensors | map('states') | select('is_number')
             | map('float') | list | median(none) %}
          {{ t is number and start_temp - t > max_drop }}
        for: "00:02:00"
      # Anything that touches the heaters during a test wins: a thermal
      # safety elsewhere has more information than this automation.
      - platform: template
        id: heater_changed
        value_template: >-
          {{ to_cut | reject('is_state', 'off') | list | count > 0
             or not is_state(target, 'on') }}
        for: "00:01:00"
      - platform: template
        id: paused
        value_template: >-
          {{ pause_entities | select('is_state', 'on') | list | count > 0 }}
      - platform: template
        id: no_temperature
        value_template: >-
          {{ temperature_sensors | map('states') | select('is_number')
             | list | count == 0 }}
        for: "00:10:00"
    timeout:
      seconds: >-
        {{ test_duration | int * 60 - settle
           if run_test and not relay_stuck else 0 }}
    continue_on_timeout: true

  - alias: "Note what the first wait saw"
    variables:
      first_stop: "{{ wait.trigger.id if wait.trigger is not none else '' }}"
      heat_seen: "{{ heat_at_start or first_stop == 'heat_seen' }}"

  - alias: "Finish the test once the heater has proved itself"
    wait_for_trigger:
      - platform: template
        id: too_cold
        value_template: >-
          {% set t = temperature_sensors | map('states') | select('is_number')
             | map('float') | list | median(none) %}
          {{ t is number and t < abort_temperature }}
        for: "00:02:00"
      - platform: template
        id: dropped
        value_template: >-
          {% set t = temperature_sensors | map('states') | select('is_number')
             | map('float') | list | median(none) %}
          {{ t is number and start_temp - t > max_drop }}
        for: "00:02:00"
      # Anything that touches the heaters during a test wins: a thermal
      # safety elsewhere has more information than this automation.
      - platform: template
        id: heater_changed
        value_template: >-
          {{ to_cut | reject('is_state', 'off') | list | count > 0
             or not is_state(target, 'on') }}
        for: "00:01:00"
      - platform: template
        id: paused
        value_template: >-
          {{ pause_entities | select('is_state', 'on') | list | count > 0 }}
      - platform: template
        id: no_temperature
        value_template: >-
          {{ temperature_sensors | map('states') | select('is_number')
             | list | count == 0 }}
        for: "00:10:00"
    timeout:
      seconds: >-
        {{ max(test_duration | int * 60 - (now().timestamp() - started_at), 0)
           if first_stop == 'heat_seen' else 0 }}
    continue_on_timeout: true

  - alias: "Read the result before the heaters come back"
    variables:
      end_temp: >-
        {{ temperature_sensors | map('states') | select('is_number')
           | map('float') | list | median(none) }}
      # A template trigger only fires on a false-to-true edge, so a relay that
      # never opened is invisible to the waits above: without this check, a
      # test where nothing was cut would pass.
      stopped_by: >-
        {%- if relay_stuck -%} relay_stuck
        {%- elif wait.trigger is not none -%} {{ wait.trigger.id }}
        {%- elif first_stop not in ['', 'heat_seen'] -%} {{ first_stop }}
        {%- elif to_cut | reject('is_state', 'off') | list | count > 0 -%} heater_changed
        {%- endif -%}
      elapsed: "{{ ((now().timestamp() - started_at) / 60) | round(0) | int }}"
      paused_now: >-
        {{ pause_entities | select('is_state', 'on') | list | count > 0 }}
      to_restore: >-
        {%- if paused_now -%} []
        {%- elif run_test -%} {{ to_cut }}
        {%- elif is_test -%} []
        {%- else -%}
          {{ heaters | select('is_state', 'off')
             | reject('in', driven_heaters) | list }}
        {%- endif -%}

  - if:
      - "{{ to_restore | count > 0 }}"
    then:
      - service: switch.turn_on
        target:
          entity_id: "{{ to_restore }}"
        continue_on_error: true

  - alias: "Give the relays time to answer"
    delay: "{{ 30 if to_restore | count > 0 else 0 }}"

  - alias: "Write the report"
    variables:
      still_off: "{{ to_restore | reject('is_state', 'on') | list }}"
      start_text: >-
        {{ start_temp | round(2) if start_temp is number else '?' }}
      end_text: "{{ end_temp | round(2) if end_temp is number else '?' }}"
      room_text: "{{ room_temp | round(1) if room_temp is number else '?' }}"
      setpoint_text: >-
        {{ heater_setpoint if heater_setpoint | float > 0 else '?' }}
      fell: >-
        {{ stopped_by in ['too_cold', 'dropped']
           or (stopped_by == '' and start_temp is number and end_temp is number
               and start_temp - end_temp > max_drop) }}
      metered: "{{ target_power != '' }}"
      message: >-
        {%- if not is_test -%}
          {%- if to_restore | count > 0 -%}A test was interrupted by a restart: heaters turned back on.{%- endif -%}
        {%- elif skip_reason == 'too_few' -%}Test not run: at least two heaters are needed.
        {%- elif skip_reason == 'power_list' -%}Test not run: give as many power sensors as heaters.
        {%- elif skip_reason == 'paused' -%}Test not run: maintenance in progress.
        {%- elif skip_reason == 'no_temperature' -%}Test not run: no temperature available.
        {%- elif skip_reason == 'too_cold' -%}Test not run: {{ start_text }}° is below {{ abort_temperature }}°.
        {%- elif skip_reason == 'no_demand' -%}Test not run: the heater would have nothing to do (tank {{ start_text }}°, room {{ room_text }}°, setpoint {{ setpoint_text }}°).
        {%- elif skip_reason == 'driven' -%}Test not run: a socket follows a probe or a schedule, set it to manual.
        {%- elif skip_reason == 'heater_off' -%}Test not run: all heaters must be on before a test.
        {%- elif relay_stuck -%}{{ cut_report.stuck | join(', ') }} still draws power after the cut: stuck relay? Test stopped, check it now.
        {%- elif fell and metered and not heat_seen -%}{{ target_name }} drew nothing while the tank cooled: {{ start_text }}° → {{ end_text }}° in {{ elapsed }} min. This heater looks dead.
        {%- elif fell and metered -%}{{ target_name }} heated but could not hold the tank alone: {{ start_text }}° → {{ end_text }}° in {{ elapsed }} min. Undersized or failing.
        {%- elif stopped_by == 'too_cold' -%}Test of {{ target_name }} stopped after {{ elapsed }} min: {{ end_text }}° is below {{ abort_temperature }}°. Heaters restored, check this heater.
        {%- elif fell -%}{{ target_name }} did not hold the tank alone: {{ start_text }}° → {{ end_text }}° after {{ elapsed }} min (allowed drop: {{ max_drop }}°). Check this heater.
        {%- elif stopped_by != '' -%}Test of {{ target_name }} interrupted after {{ elapsed }} min, no verdict ({{ start_text }}° → {{ end_text }}°).
        {%- elif metered and not heat_seen -%}No verdict for {{ target_name }}: {{ start_text }}° → {{ end_text }}° in {{ elapsed }} min, but it never drew power, so it was not proven. Its thermostat may be set too low, or the room warm enough for it to stay idle.
        {%- elif metered -%}{{ target_name }} held the tank alone for {{ elapsed }} min: {{ start_text }}° → {{ end_text }}°. Test passed. Consumption confirmed.
        {%- else -%}{{ target_name }} held the tank alone for {{ elapsed }} min: {{ start_text }}° → {{ end_text }}°. Test passed.
        {%- endif -%}
        {%- if run_test and not relay_stuck and stopped_by in ['', 'dropped', 'too_cold'] -%}
          {%- if cut_report.proven | count > 0 %} Cut confirmed for {{ cut_report.proven | join(', ') }}.{%- endif -%}
          {%- if cut_report.unproven | count > 0 %} Cut not provable for {{ cut_report.unproven | join(', ') }}, not drawing beforehand.{%- endif -%}
        {%- endif -%}
        {%- if paused_now and run_test %} Maintenance in progress: heaters stay off until it ends.{%- endif -%}
        {%- if still_off | count > 0 %} Warning, still off: {{ still_off | join(', ') }}.{%- endif -%}

  - condition: template
    value_template: "{{ message | length > 0 }}"

  # A text helper keeps the last outcome, and its history keeps the others.
  - if:
      - "{{ result_entity != '' }}"
    then:
      - service: input_text.set_value
        target:
          entity_id: "{{ result_entity }}"
        data:
          value: >-
            {{ (now().strftime('%Y-%m-%d') ~ ' ' ~ message)
               [:state_attr(result_entity, 'max') | int(100)] }}
        continue_on_error: true

  - alias: "Dispatch to each selected mobile device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - variables:
            # `name`, not `name_by_user`: the notify service slug is frozen
            # at install time and ignores later renames in the UI.
            mobile_slug: >-
              {{ (device_attr(repeat.item, 'name')
                  or repeat.item) | slugify }}
        - service: "notify.mobile_app_{{ mobile_slug }}"
          continue_on_error: true
          data:
            title: "Reef — heater test"
            message: "{{ message }}"
            data: >-
              {{
                {
                  'tag': 'reef_heater_test',
                  'channel': notify_channel
                } if notify_channel else {'tag': 'reef_heater_test'}
              }}
