# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Sorveglianza manutenzione barriera (it) — v0.1.0
  description: >
    Vi avvisa delle **manutenzioni scadute** su qualunque integrazione dell'ecosistema ReefTech e dei **dispositivi diventati irraggiungibili**.\n\nIl rilevamento delle manutenzioni non richiede configurazione: trova le attività tramite l'attributo `reef_role`, quindi ha-reefbeat-component, ha-aquamedic-component e ha-reef-maintenance-component sono coperti, così come ogni futura integrazione che pubblichi lo stesso contratto.\n\nLa raggiungibilità si basa sull'elenco di dispositivi che scegliete qui sotto. Home Assistant nasconde gli attributi di un'entità non disponibile, quindi questo controllo non può scoprirli da solo.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Destinatari delle notifiche
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Dispositivi mobili da notificare
          description: >
            I dispositivi che riceveranno le notifiche. Compaiono solo telefoni e tablet registrati tramite l'app Home Assistant. Viene inviata una notifica per dispositivo.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Canale Android (facoltativo)
          description: >
            Nome del canale passato in `data.channel`, per raggruppare queste notifiche e dare loro suono o priorità propri. Lasciate vuoto per il canale predefinito. iOS ignora questo campo.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Manutenzione scaduta
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Attiva
          description: >
            Sorveglia ogni pulsante con un `reef_role` che inizia per `maint_`, e avvisa quando il suo `days_left` diventa negativo.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Rispetta gli interruttori di notifica per attività
          description: >
            Se attivo, un'attività il cui interruttore «(notifiche)» è spento viene saltata anche se scaduta. Lasciate attivo, a meno che non vogliate l'avviso a prescindere dagli interruttori.
          default: true
          selector: {boolean: {}}

    unreachable_section:
      name: Dispositivi irraggiungibili
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Attiva
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Dispositivi da sorvegliare
          description: >
            Un dispositivo è segnalato irraggiungibile quando tutte le sue entità sono non disponibili. L'elenco è esplicito perché un'entità non disponibile non espone più l'attributo `reef_role` che avrebbe permesso di trovarla. Lasciate vuoto per disattivare il controllo.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- 1) Maintenance overdue.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Manutenzione scaduta da " ~ (-dl) ~ " giorni: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Dispositivo irraggiungibile',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Barriera — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {{
                          {
                            'tag': notif_tag,
                            'channel': notify_channel
                          } if notify_channel else {'tag': notif_tag}
                        }}
