# Generated by scripts/gen_relay_watch.py -- do not edit by hand.
# Edit the strings in that script and run gen_blueprints.py again.
blueprint:
  name: Nadzór przekaźników rafy (pl) — v1.2.0
  description: >
    Ostrzega, gdy przekaźnik jest wyłączony, a urządzenie nadal pobiera moc: sklejony styk lub gniazdo, które przestało słuchać. Nadzór działa stale, na wszystkich gniazdach wybranych urządzeń.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  homeassistant:
    min_version: "2024.8.0"
  input:
    watch_section:
      name: Co nadzorować
      icon: mdi:electric-switch
      input:
        watched_devices:
          name: Urządzenia Red Sea
          description: >
            Nadzorowane jest każde gniazdo ReefControl-Power i każdy port ReefControl, a czujnik poboru jest znajdowany automatycznie.
          default: []
          selector:
            device:
              integration: redsea
              multiple: true
        relays:
          name: Inne przekaźniki
          description: >
            Przełączniki z innych integracji. Nadzorować można tylko te, których urządzenie ma jeden czujnik mocy, jak inteligentna wtyczka.
          default: []
          selector:
            entity:
              domain: switch
              multiple: true
        power_threshold:
          name: Próg poboru
          description: >
            Powyżej tej wartości wyłączony przekaźnik jest uznawany za nadal pobierający moc. Ustaw powyżej odczytu czuwania licznika.
          default: 10
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: W
              mode: box
        grace_minutes:
          name: Opóźnienie po wyłączeniu
          description: >
            Czas na aktualizację licznika po otwarciu przekaźnika. RS Power odświeża się raz na minutę: zachowaj co najmniej 3 minuty.
          default: 5
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: min
              mode: box

    notify_section:
      name: Powiadomienia
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Urządzenia mobilne do powiadamiania
          description: >
            Na liście są tylko telefony i tablety zarejestrowane przez aplikację Home Assistant.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Kanał Android (opcjonalnie)
          description: >
            Nazwa kanału przekazywana w `data.channel`. Pozostaw puste dla kanału domyślnego. iOS ignoruje to pole.
          default: "Reef"
          selector:
            text:

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  watched_devices: !input watched_devices
  relays: !input relays
  power_threshold: !input power_threshold
  grace_minutes: !input grace_minutes
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel

action:
  - alias: "Find the relays that are off but still draw power"
    variables:
      alerts: >-
        {%- set found = namespace(items=relays | list) -%}
        {%- for device in watched_devices -%}
          {%- for e in device_entities(device) | select('match', 'switch[.]') -%}
            {%- if (state_attr(e, 'reef_role') or '').endswith('_on_off') -%}
              {%- set found.items = found.items + [e] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for h in found.items | unique -%}
          {%- set role = state_attr(h, 'reef_role') or '' -%}
          {%- set prefix = role[:-7] if role.endswith('_on_off') else '' -%}
          {%- set d = device_id(h) -%}
          {%- set ents = device_entities(d) if d else [] -%}
          {%- set own = (ents | select('is_state_attr', 'reef_role',
                prefix ~ '_consumption') | list) if prefix else [] -%}
          {%- set meters = ents | select('match', 'sensor[.]')
                | select('is_state_attr', 'device_class', 'power') | list -%}
          {%- set meter = own[0] if own
                else meters[0] if meters | count == 1 and not prefix
                else '' -%}
          {%- if meter and is_state(h, 'off')
                and (now() - states[h].last_changed).total_seconds()
                    > grace_minutes * 60
                and states(meter) | float(0) > power_threshold -%}
            {%- set ns.items = ns.items + [{
              'relay': h,
              'name': state_attr(h, 'friendly_name') or h,
              'power': states(meter),
            }] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}

  - alias: "Notify for each relay"
    repeat:
      for_each: "{{ alerts }}"
      sequence:
        - variables:
            relay: "{{ repeat.item.relay }}"
            message: "{{ repeat.item.name }} jest wyłączony, ale nadal pobiera {{ repeat.item.power }} W: sklejony przekaźnik?"
        - alias: "Dispatch to each selected mobile device"
          repeat:
            for_each: "{{ notify_devices }}"
            sequence:
              - variables:
                  # `name`, not `name_by_user`: the notify service slug is
                  # frozen at install time and ignores later renames in the UI.
                  mobile_slug: >-
                    {{ (device_attr(repeat.item, 'name')
                        or repeat.item) | slugify }}
              - service: "notify.mobile_app_{{ mobile_slug }}"
                continue_on_error: true
                data:
                  title: "Rafa — przekaźnik"
                  message: "{{ message }}"
                  # alert_once: the check repeats every five minutes for as
                  # long as the fault lasts, the phone should buzz only once.
                  data: >-
                    {{
                      {
                        'tag': 'reef_relay_' ~ relay,
                        'channel': notify_channel,
                        'alert_once': true
                      } if notify_channel else {
                        'tag': 'reef_relay_' ~ relay,
                        'alert_once': true
                      }
                    }}
