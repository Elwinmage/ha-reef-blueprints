# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Reef maintenance watch (en) — v1.0.0
  description: >
    Notifies you about **overdue maintenance** on any integration of the ReefTech ecosystem, and about **devices that went unreachable**.\n\nMaintenance detection needs no configuration: it finds the tasks through the `reef_role` attribute, so ha-reefbeat-component, ha-aquamedic-component and ha-reef-maintenance-component are all covered, and so is any future integration publishing the same contract.\n\nReachability works from the device list you pick below. Home Assistant hides the attributes of an unavailable entity, so this check cannot discover devices on its own.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Notification targets
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Mobile devices to notify
          description: >
            The device(s) that receive the notifications. Only phones and tablets registered through the Home Assistant Companion app are listed. One notification is sent per device.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Android channel (optional)
          description: >
            Channel name passed in `data.channel`, to group these notifications and give them their own sound or priority. Leave empty for the default channel. iOS ignores this field.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Maintenance overdue
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Enable
          description: >
            Watches every button carrying a `reef_role` that starts with `maint_`, and alerts when its `days_left` goes negative.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Respect the per-task notification switches
          description: >
            When enabled, a task whose «(notifications)» switch is off is skipped even when overdue. Leave it on unless you want the alert regardless of the switches.
          default: true
          selector: {boolean: {}}

    unreachable_section:
      name: Unreachable devices
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Enable
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Devices to watch
          description: >
            A device is reported unreachable when all of its entities are unavailable. The list is explicit because an unavailable entity no longer exposes the `reef_role` attribute this blueprint would otherwise use to find it. Leave empty to disable the check.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- 1) Maintenance overdue.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Maintenance overdue by " ~ (-dl) ~ " days: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Device unreachable',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Reef — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {{
                          {
                            'tag': notif_tag,
                            'channel': notify_channel
                          } if notify_channel else {'tag': notif_tag}
                        }}
