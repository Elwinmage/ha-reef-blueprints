# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Surveillance maintenance récif (fr) — v1.1.1
  description: >
    Vous prévient des **entretiens en retard** sur toutes les intégrations de l'écosystème ReefTech, et des **appareils devenus injoignables**.\n\nLa détection des entretiens ne demande aucune configuration : elle trouve les tâches par l'attribut `reef_role`, donc ha-reefbeat-component, ha-aquamedic-component et ha-reef-maintenance-component sont couverts, ainsi que toute future intégration publiant le même contrat.\n\nL'injoignabilité s'appuie sur la liste d'appareils que vous choisissez ci-dessous. Home Assistant masque les attributs d'une entité indisponible : ce contrôle ne peut donc pas découvrir les appareils tout seul.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Destinataires des notifications
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Mobiles à notifier
          description: >
            Le ou les appareils qui recevront les notifications. Seuls les téléphones et tablettes enregistrés via l'application Home Assistant apparaissent. Une notification est envoyée par appareil.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Canal Android (optionnel)
          description: >
            Nom de canal passé dans `data.channel`, pour regrouper ces notifications et leur donner un son ou une priorité propres. Laissez vide pour le canal par défaut. iOS ignore ce champ.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Entretien en retard
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Activer
          description: >
            Surveille chaque bouton portant un `reef_role` commençant par `maint_`, et alerte quand son `days_left` devient négatif.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Respecter les interrupteurs de notification par tâche
          description: >
            Si activé, une tâche dont l'interrupteur « (notifications) » est coupé est ignorée même en retard. Laissez activé, sauf si vous voulez l'alerte quels que soient les interrupteurs.
          default: true
          selector: {boolean: {}}
        reminder_hours:
          name: Intervalle de rappel (heures)
          description: >
            Fréquence de renvoi d'une alerte de maintenance tant que la tâche reste en retard. 1 pour chaque heure, 24 pour une fois par jour. Les alertes d'appareils injoignables ne sont envoyées qu'une seule fois.
          default: 4
          selector:
            number:
              min: 1
              max: 24
              unit_of_measurement: "h"
              mode: slider

    unreachable_section:
      name: Appareils injoignables
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Activer
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Appareils à surveiller
          description: >
            Un appareil est signalé injoignable quand toutes ses entités sont indisponibles. La liste est explicite car une entité indisponible n'expose plus l'attribut `reef_role` qui aurait permis de la trouver. Laissez vide pour désactiver ce contrôle.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  reminder_hours: !input reminder_hours
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- Maintenance alerts fire only inside a time window whose width
            equals the configured reminder_hours.  With reminder_hours=4
            the window opens at hours 0, 4, 8, 12, 16, 20 for five
            minutes each -- just enough for the /5 trigger to hit it
            exactly once. -#}
        {%- set maint_window = (now().hour % (reminder_hours | int) == 0)
                               and now().minute < 5 -%}

        {#- 1) Maintenance overdue -- gated by maint_window so the user
            is not buzzed every five minutes.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance and maint_window -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Entretien en retard de " ~ (-dl) ~ " jours : " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes.
            Checked every run for fast detection; alert_once in the
            notification data prevents repeated buzzing. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Appareil injoignable',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Récif — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
                # Carried into the inner loop for the alert_once flag.
                alert_type: "{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {%- if alert_type == 'unreachable' -%}
                          {{
                            {
                              'tag': notif_tag,
                              'channel': notify_channel,
                              'alert_once': true
                            } if notify_channel else {
                              'tag': notif_tag,
                              'alert_once': true
                            }
                          }}
                        {%- else -%}
                          {{
                            {
                              'tag': notif_tag,
                              'channel': notify_channel
                            } if notify_channel else {'tag': notif_tag}
                          }}
                        {%- endif -%}
