# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Rif-onderhoudsbewaking (nl) — v1.0.0
  description: >
    Waarschuwt u voor **achterstallig onderhoud** in elke integratie van het ReefTech-ecosysteem, en voor **apparaten die onbereikbaar zijn geworden**.\n\nDe onderhoudsdetectie vergt geen configuratie: ze vindt de taken via het `reef_role`-attribuut, dus ha-reefbeat-component, ha-aquamedic-component en ha-reef-maintenance-component zijn gedekt, net als elke toekomstige integratie met hetzelfde contract.\n\nDe bereikbaarheid werkt met de apparatenlijst die u hieronder kiest. Home Assistant verbergt de attributen van een niet-beschikbare entiteit, dus deze controle kan apparaten niet zelf ontdekken.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Ontvangers van meldingen
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Te waarschuwen mobiele apparaten
          description: >
            De apparaten die de meldingen ontvangen. Alleen telefoons en tablets die via de Home Assistant Companion-app zijn geregistreerd verschijnen hier. Er wordt één melding per apparaat verstuurd.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Android-kanaal (optioneel)
          description: >
            Kanaalnaam die in `data.channel` wordt meegegeven, om deze meldingen te groeperen en een eigen geluid of prioriteit te geven. Laat leeg voor het standaardkanaal. iOS negeert dit veld.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Achterstallig onderhoud
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Inschakelen
          description: >
            Bewaakt elke knop met een `reef_role` die met `maint_` begint, en waarschuwt zodra de `days_left` negatief wordt.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Respecteer de meldingsschakelaars per taak
          description: >
            Indien ingeschakeld wordt een taak waarvan de schakelaar «(meldingen)» uit staat overgeslagen, ook bij achterstand. Laat aan staan, tenzij u de melding hoe dan ook wilt.
          default: true
          selector: {boolean: {}}

    unreachable_section:
      name: Onbereikbare apparaten
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Inschakelen
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Te bewaken apparaten
          description: >
            Een apparaat geldt als onbereikbaar wanneer al zijn entiteiten niet beschikbaar zijn. De lijst is expliciet omdat een niet-beschikbare entiteit het `reef_role`-attribuut niet meer toont waarmee ze anders gevonden zou worden. Laat leeg om de controle uit te zetten.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- 1) Maintenance overdue.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Onderhoud " ~ (-dl) ~ " dagen achterstallig: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Apparaat onbereikbaar',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Rif — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {{
                          {
                            'tag': notif_tag,
                            'channel': notify_channel
                          } if notify_channel else {'tag': notif_tag}
                        }}
