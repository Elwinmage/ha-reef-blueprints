# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Vigilancia de mantenimiento del arrecife (es) — v0.1.0
  description: >
    Le avisa de los **mantenimientos vencidos** en cualquier integración del ecosistema ReefTech, y de los **dispositivos que han dejado de responder**.\n\nLa detección de mantenimientos no necesita configuración: encuentra las tareas por el atributo `reef_role`, así que ha-reefbeat-component, ha-aquamedic-component y ha-reef-maintenance-component quedan cubiertos, y también cualquier integración futura que publique el mismo contrato.\n\nLa disponibilidad se apoya en la lista de dispositivos que elija más abajo. Home Assistant oculta los atributos de una entidad no disponible, así que esta comprobación no puede descubrirlos sola.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Destinatarios de las notificaciones
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Móviles a notificar
          description: >
            Los dispositivos que recibirán las notificaciones. Solo aparecen los teléfonos y tabletas registrados con la app Home Assistant. Se envía una notificación por dispositivo.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Canal de Android (opcional)
          description: >
            Nombre de canal pasado en `data.channel`, para agrupar estas notificaciones y darles su propio sonido o prioridad. Déjelo vacío para el canal por defecto. iOS ignora este campo.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Mantenimiento vencido
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Activar
          description: >
            Vigila cada botón con un `reef_role` que empiece por `maint_`, y avisa cuando su `days_left` se vuelve negativo.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Respetar los interruptores de notificación por tarea
          description: >
            Si está activado, una tarea cuyo interruptor «(notificaciones)» esté apagado se omite aunque esté vencida. Déjelo activado salvo que quiera el aviso pase lo que pase.
          default: true
          selector: {boolean: {}}

    unreachable_section:
      name: Dispositivos no disponibles
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Activar
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Dispositivos a vigilar
          description: >
            Un dispositivo se señala como no disponible cuando todas sus entidades lo están. La lista es explícita porque una entidad no disponible ya no expone el atributo `reef_role` que habría permitido encontrarla. Déjela vacía para desactivar la comprobación.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- 1) Maintenance overdue.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Mantenimiento vencido hace " ~ (-dl) ~ " días: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Dispositivo no disponible',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Arrecife — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {{
                          {
                            'tag': notif_tag,
                            'channel': notify_channel
                          } if notify_channel else {'tag': notif_tag}
                        }}
