# Generated by scripts/gen_relay_watch.py -- do not edit by hand.
# Edit the strings in that script and run gen_blueprints.py again.
blueprint:
  name: Riff-Relaisüberwachung (de) — v1.3.0
  description: >
    Warnt Sie, wenn ein Relais ausgeschaltet ist, sein Gerät aber weiter Strom verbraucht: verklebter Kontakt oder eine Steckdose, die nicht mehr gehorcht. Die Überwachung läuft ständig, für alle Steckdosen der gewählten Geräte.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  homeassistant:
    min_version: "2024.8.0"
  input:
    watch_section:
      name: Was überwacht wird
      icon: mdi:electric-switch
      input:
        watched_devices:
          name: Red-Sea-Geräte
          description: >
            Jede Steckdose eines ReefControl-Power und jeder Port eines ReefControl wird überwacht, der zugehörige Verbrauchssensor wird automatisch gefunden.
          default: []
          selector:
            device:
              integration: redsea
              multiple: true
        relays:
          name: Weitere Relais
          description: >
            Schalter anderer Integrationen. Überwacht werden können nur solche, deren Gerät genau einen Leistungssensor hat, wie eine smarte Steckdose.
          default: []
          selector:
            entity:
              domain: switch
              multiple: true
        power_threshold:
          name: Verbrauchsschwelle
          description: >
            Oberhalb dieses Werts gilt ein ausgeschaltetes Relais als weiter verbrauchend. Über dem Standby-Wert des Zählers halten.
          default: 10
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: W
              mode: box
        grace_minutes:
          name: Verzögerung nach dem Abschalten
          description: >
            Zeit, die der Zähler nach dem Öffnen des Relais zum Aktualisieren bekommt. Das RS Power aktualisiert einmal pro Minute: mindestens 3 Minuten beibehalten.
          default: 5
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: min
              mode: box

    notify_section:
      name: Benachrichtigungen
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Zu benachrichtigende Mobilgeräte
          description: >
            Es werden nur über die Home-Assistant-App registrierte Telefone und Tablets angezeigt.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Android-Kanal (optional)
          description: >
            Kanalname für `data.channel`. Für den Standardkanal leer lassen. iOS ignoriert dieses Feld.
          default: "Reef"
          selector:
            text:

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  watched_devices: !input watched_devices
  relays: !input relays
  power_threshold: !input power_threshold
  grace_minutes: !input grace_minutes
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel

action:
  - alias: "Find the relays that are off but still draw power"
    variables:
      alerts: >-
        {%- set found = namespace(items=relays | list) -%}
        {%- for device in watched_devices -%}
          {%- for e in device_entities(device) | select('match', 'switch[.]') -%}
            {%- if (state_attr(e, 'reef_role') or '').endswith('_on_off') -%}
              {%- set found.items = found.items + [e] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for h in found.items | unique -%}
          {%- set role = state_attr(h, 'reef_role') or '' -%}
          {%- set prefix = role[:-7] if role.endswith('_on_off') else '' -%}
          {%- set d = device_id(h) -%}
          {%- set ents = device_entities(d) if d else [] -%}
          {%- set own = (ents | select('is_state_attr', 'reef_role',
                prefix ~ '_consumption') | list) if prefix else [] -%}
          {%- set meters = ents | select('match', 'sensor[.]')
                | select('is_state_attr', 'device_class', 'power') | list -%}
          {%- set meter = own[0] if own
                else meters[0] if meters | count == 1 and not prefix
                else '' -%}
          {%- if meter and is_state(h, 'off')
                and (now() - states[h].last_changed).total_seconds()
                    > grace_minutes * 60
                and states(meter) | float(0) > power_threshold -%}
            {%- set ns.items = ns.items + [{
              'relay': h,
              'name': state_attr(h, 'friendly_name') or h,
              'power': states(meter),
            }] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}

  - alias: "Notify for each relay"
    repeat:
      for_each: "{{ alerts }}"
      sequence:
        - variables:
            relay: "{{ repeat.item.relay }}"
            message: "{{ repeat.item.name }} ist aus, verbraucht aber noch {{ repeat.item.power }} W: Relais verklebt?"
        - alias: "Dispatch to each selected mobile device"
          repeat:
            for_each: "{{ notify_devices }}"
            sequence:
              - variables:
                  # `name`, not `name_by_user`: the notify service slug is
                  # frozen at install time and ignores later renames in the UI.
                  mobile_slug: >-
                    {{ (device_attr(repeat.item, 'name')
                        or repeat.item) | slugify }}
              - service: "notify.mobile_app_{{ mobile_slug }}"
                continue_on_error: true
                data:
                  title: "Riff — Relais"
                  message: "{{ message }}"
                  # alert_once: the check repeats every five minutes for as
                  # long as the fault lasts, the phone should buzz only once.
                  data: >-
                    {{
                      {
                        'tag': 'reef_relay_' ~ relay,
                        'channel': notify_channel,
                        'alert_once': true
                      } if notify_channel else {
                        'tag': 'reef_relay_' ~ relay,
                        'alert_once': true
                      }
                    }}
