# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Monitor konserwacji rafy (pl) — v0.1.0
  description: >
    Powiadamia o **zaległych konserwacjach** w każdej integracji ekosystemu ReefTech oraz o **urządzeniach, które przestały odpowiadać**.\n\nWykrywanie konserwacji nie wymaga konfiguracji: znajduje zadania przez atrybut `reef_role`, więc ha-reefbeat-component, ha-aquamedic-component i ha-reef-maintenance-component są objęte, podobnie jak każda przyszła integracja publikująca ten sam kontrakt.\n\nDostępność opiera się na liście urządzeń wybranej poniżej. Home Assistant ukrywa atrybuty niedostępnej encji, więc ta kontrola nie potrafi sama ich odnaleźć.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Odbiorcy powiadomień
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Urządzenia mobilne do powiadomienia
          description: >
            Urządzenia, które otrzymają powiadomienia. Wyświetlane są tylko telefony i tablety zarejestrowane w aplikacji Home Assistant. Na każde urządzenie wysyłane jest jedno powiadomienie.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Kanał Androida (opcjonalnie)
          description: >
            Nazwa kanału przekazywana w `data.channel`, aby zgrupować te powiadomienia i nadać im własny dźwięk lub priorytet. Zostaw puste dla kanału domyślnego. iOS ignoruje to pole.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Zaległa konserwacja
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Włącz
          description: >
            Obserwuje każdy przycisk z `reef_role` zaczynającym się od `maint_` i alarmuje, gdy jego `days_left` staje się ujemny.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Uwzględniaj przełączniki powiadomień poszczególnych zadań
          description: >
            Gdy włączone, zadanie z wyłączonym przełącznikiem «(powiadomienia)» jest pomijane nawet gdy zalega. Zostaw włączone, chyba że chcesz alert niezależnie od przełączników.
          default: true
          selector: {boolean: {}}

    unreachable_section:
      name: Niedostępne urządzenia
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Włącz
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Urządzenia do obserwacji
          description: >
            Urządzenie jest zgłaszane jako niedostępne, gdy wszystkie jego encje są niedostępne. Lista jest jawna, ponieważ niedostępna encja nie udostępnia już atrybutu `reef_role`, po którym można by ją odnaleźć. Zostaw pustą, aby wyłączyć tę kontrolę.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- 1) Maintenance overdue.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Konserwacja zaległa o " ~ (-dl) ~ " dni: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Urządzenie niedostępne',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Rafa — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {{
                          {
                            'tag': notif_tag,
                            'channel': notify_channel
                          } if notify_channel else {'tag': notif_tag}
                        }}
