# Generated by scripts/gen_blueprints.py -- do not edit by hand.
# Edit the strings in that script and run it again.
blueprint:
  name: Riff-Wartungsüberwachung (de) — v1.1.0
  description: >
    Benachrichtigt Sie über **überfällige Wartungen** in allen Integrationen des ReefTech-Ökosystems und über **nicht mehr erreichbare Geräte**.\n\nDie Wartungserkennung braucht keine Konfiguration: sie findet die Aufgaben über das `reef_role`-Attribut, also sind ha-reefbeat-component, ha-aquamedic-component und ha-reef-maintenance-component abgedeckt, ebenso jede künftige Integration mit demselben Vertrag.\n\nDie Erreichbarkeit stützt sich auf die unten gewählte Geräteliste. Home Assistant blendet die Attribute einer nicht verfügbaren Entität aus, diese Prüfung kann Geräte daher nicht selbst finden.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  input:
    notify_section:
      name: Benachrichtigungsziele
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Zu benachrichtigende Mobilgeräte
          description: >
            Die Geräte, die die Benachrichtigungen erhalten. Es werden nur Telefone und Tablets angezeigt, die über die Home Assistant Companion App registriert sind. Pro Gerät wird eine Benachrichtigung gesendet.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Android-Kanal (optional)
          description: >
            In `data.channel` übergebener Kanalname, um diese Benachrichtigungen zu gruppieren und ihnen eigenen Ton oder eigene Priorität zu geben. Leer lassen für den Standardkanal. iOS ignoriert dieses Feld.
          default: "Reef"
          selector:
            text:

    maintenance_section:
      name: Überfällige Wartung
      icon: mdi:wrench-clock
      input:
        notify_maintenance:
          name: Aktivieren
          description: >
            Überwacht jede Schaltfläche mit einer `reef_role`, die mit `maint_` beginnt, und meldet, wenn ihr `days_left` negativ wird.
          default: true
          selector: {boolean: {}}
        maintenance_respect_switch:
          name: Die Benachrichtigungsschalter je Aufgabe beachten
          description: >
            Wenn aktiviert, wird eine Aufgabe, deren Schalter «(Benachrichtigungen)» aus ist, auch bei Überfälligkeit übersprungen. Aktiviert lassen, außer Sie wollen die Meldung unabhängig von den Schaltern.
          default: true
          selector: {boolean: {}}
        reminder_hours:
          name: Erinnerungsintervall (Stunden)
          description: >
            Wie oft eine Wartungsmeldung erneut gesendet wird, solange die Aufgabe überfällig bleibt. 1 für stündlich, 24 für einmal am Tag. Meldungen nicht erreichbarer Geräte werden nur einmal gesendet.
          default: 4
          selector:
            number:
              min: 1
              max: 24
              unit_of_measurement: "h"
              mode: slider

    unreachable_section:
      name: Nicht erreichbare Geräte
      icon: mdi:lan-disconnect
      input:
        notify_unavailable:
          name: Aktivieren
          default: true
          selector: {boolean: {}}
        watched_devices:
          name: Zu überwachende Geräte
          description: >
            Ein Gerät gilt als nicht erreichbar, wenn alle seine Entitäten nicht verfügbar sind. Die Liste ist ausdrücklich, weil eine nicht verfügbare Entität das `reef_role`-Attribut nicht mehr zeigt, über das sie sonst gefunden würde. Leer lassen, um die Prüfung zu deaktivieren.
          default: []
          selector:
            device:
              multiple: true

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_maintenance: !input notify_maintenance
  maintenance_respect_switch: !input maintenance_respect_switch
  reminder_hours: !input reminder_hours
  notify_unavailable: !input notify_unavailable
  watched_devices: !input watched_devices
  # The shared contract. Every integration of the ecosystem tags its
  # maintenance buttons with a reef_role starting with this prefix.
  role_maintenance_prefix: "maint_"

action:
  - alias: "Build the alerts list"
    variables:
      alerts: >
        {%- set ns = namespace(items=[]) -%}

        {#- Maintenance alerts fire only inside a time window whose width
            equals the configured reminder_hours.  With reminder_hours=4
            the window opens at hours 0, 4, 8, 12, 16, 20 for five
            minutes each -- just enough for the /5 trigger to hit it
            exactly once. -#}
        {%- set maint_window = (now().hour % (reminder_hours | int) == 0)
                               and now().minute < 5 -%}

        {#- 1) Maintenance overdue -- gated by maint_window so the user
            is not buzzed every five minutes.
            Scans the button domain only: a maintenance task is always a
            button, and iterating one domain instead of the whole state
            machine keeps this cheap at every run. -#}
        {%- if notify_maintenance and maint_window -%}
          {%- for e in states.button -%}
            {%- set role = e.attributes.get('reef_role') or '' -%}
            {%- if role.startswith(role_maintenance_prefix) -%}
              {#- Per-task opt-out: the button mirrors its companion notify
                  switch in the `notify` attribute. A missing attribute is
                  treated as enabled, so an older integration still works. -#}
              {%- set notify_flag = e.attributes.get('notify') -%}
              {%- set muted = maintenance_respect_switch and notify_flag is false -%}
              {%- set dl = e.attributes.get('days_left') -%}
              {%- if dl is number and dl < 0 and not muted -%}
                {%- set d = device_id(e.entity_id) -%}
                {%- set dname = (d and (device_attr(d, 'name_by_user')
                                        or device_attr(d, 'name')))
                                or e.entity_id -%}
                {%- set ns.items = ns.items + [{
                  'type': 'maintenance',
                  'device': dname,
                  'message': "Wartung " ~ (-dl) ~ " Tage überfällig: " ~ (e.attributes.get('friendly_name') or e.entity_id),
                }] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {#- 2) Unreachable devices: every entity of a watched device is
            unavailable. Driven by the picked list rather than by reef_role,
            which an unavailable entity no longer exposes.
            Checked every run for fast detection; alert_once in the
            notification data prevents repeated buzzing. -#}
        {%- if notify_unavailable -%}
          {%- for d in watched_devices -%}
            {%- set dents = device_entities(d) -%}
            {%- set total = dents | count -%}
            {%- set unav = dents | select('is_state', 'unavailable') | list | count -%}
            {%- if total > 0 and unav == total -%}
              {%- set ns.items = ns.items + [{
                'type': 'unreachable',
                'device': device_attr(d, 'name_by_user')
                          or device_attr(d, 'name') or d,
                'message': 'Gerät nicht erreichbar',
              }] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}

        {{ ns.items }}

  - alias: "Notify for each alert"
    if:
      - "{{ alerts | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ alerts }}"
          sequence:
            - variables:
                title: "Riff — {{ repeat.item.device }}"
                message: "{{ repeat.item.message }}"
                # Unique tag per (device, alert type) so a new notification
                # replaces the previous one instead of stacking.
                notif_tag: "reef_{{ repeat.item.device }}_{{ repeat.item.type }}"
                # Carried into the inner loop for the alert_once flag.
                alert_type: "{{ repeat.item.type }}"
            - alias: "Dispatch to each selected mobile device"
              repeat:
                for_each: "{{ notify_devices }}"
                sequence:
                  - variables:
                      # `name`, not `name_by_user`: the notify service slug is
                      # frozen at install time and ignores later renames in the
                      # Home Assistant UI.
                      mobile_slug: >-
                        {{ (device_attr(repeat.item, 'name')
                            or repeat.item) | slugify }}
                  - service: "notify.mobile_app_{{ mobile_slug }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
                      data: >-
                        {%- if alert_type == 'unreachable' -%}
                          {{
                            {
                              'tag': notif_tag,
                              'channel': notify_channel,
                              'alert_once': true
                            } if notify_channel else {
                              'tag': notif_tag,
                              'alert_once': true
                            }
                          }}
                        {%- else -%}
                          {{
                            {
                              'tag': notif_tag,
                              'channel': notify_channel
                            } if notify_channel else {'tag': notif_tag}
                          }}
                        {%- endif -%}
