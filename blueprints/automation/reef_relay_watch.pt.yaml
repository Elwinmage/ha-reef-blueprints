# Generated by scripts/gen_relay_watch.py -- do not edit by hand.
# Edit the strings in that script and run gen_blueprints.py again.
blueprint:
  name: Vigilância de relés do recife (pt) — v1.2.0
  description: >
    Avisa quando um relé está desligado mas o aparelho continua a consumir: contacto colado ou uma tomada que já não obedece. A vigilância funciona em permanência, em todas as tomadas dos dispositivos escolhidos.
  domain: automation
  source_url: https://github.com/Elwinmage/ha-reef-blueprints
  homeassistant:
    min_version: "2024.8.0"
  input:
    watch_section:
      name: O que vigiar
      icon: mdi:electric-switch
      input:
        watched_devices:
          name: Dispositivos Red Sea
          description: >
            Cada tomada de um ReefControl-Power e cada porta de um ReefControl é vigiada, com o sensor de consumo encontrado automaticamente.
          default: []
          selector:
            device:
              integration: redsea
              multiple: true
        relays:
          name: Outros relés
          description: >
            Interruptores de outras integrações. Só podem ser vigiados aqueles cujo dispositivo tem um único sensor de potência, como uma tomada inteligente.
          default: []
          selector:
            entity:
              domain: switch
              multiple: true
        power_threshold:
          name: Limiar de consumo
          description: >
            Acima deste valor, um relé desligado conta como ainda a consumir. Mantenha-o acima do repouso do medidor.
          default: 10
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: W
              mode: box
        grace_minutes:
          name: Atraso após desligar
          description: >
            Tempo dado ao medidor para se atualizar após a abertura do relé. O RS Power atualiza uma vez por minuto: mantenha pelo menos 3 minutos.
          default: 5
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: min
              mode: box

    notify_section:
      name: Notificações
      icon: mdi:bell-outline
      input:
        notify_devices:
          name: Dispositivos móveis a notificar
          description: >
            Só aparecem os telemóveis e tablets registados através da aplicação Home Assistant.
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_channel:
          name: Canal Android (opcional)
          description: >
            Nome do canal enviado em `data.channel`. Deixe vazio para o canal predefinido. O iOS ignora este campo.
          default: "Reef"
          selector:
            text:

trigger:
  - platform: time_pattern
    minutes: "/5"

variables:
  watched_devices: !input watched_devices
  relays: !input relays
  power_threshold: !input power_threshold
  grace_minutes: !input grace_minutes
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel

action:
  - alias: "Find the relays that are off but still draw power"
    variables:
      alerts: >-
        {%- set found = namespace(items=relays | list) -%}
        {%- for device in watched_devices -%}
          {%- for e in device_entities(device) | select('match', 'switch[.]') -%}
            {%- if (state_attr(e, 'reef_role') or '').endswith('_on_off') -%}
              {%- set found.items = found.items + [e] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for h in found.items | unique -%}
          {%- set role = state_attr(h, 'reef_role') or '' -%}
          {%- set prefix = role[:-7] if role.endswith('_on_off') else '' -%}
          {%- set d = device_id(h) -%}
          {%- set ents = device_entities(d) if d else [] -%}
          {%- set own = (ents | select('is_state_attr', 'reef_role',
                prefix ~ '_consumption') | list) if prefix else [] -%}
          {%- set meters = ents | select('match', 'sensor[.]')
                | select('is_state_attr', 'device_class', 'power') | list -%}
          {%- set meter = own[0] if own
                else meters[0] if meters | count == 1 and not prefix
                else '' -%}
          {%- if meter and is_state(h, 'off')
                and (now() - states[h].last_changed).total_seconds()
                    > grace_minutes * 60
                and states(meter) | float(0) > power_threshold -%}
            {%- set ns.items = ns.items + [{
              'relay': h,
              'name': state_attr(h, 'friendly_name') or h,
              'power': states(meter),
            }] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}

  - alias: "Notify for each relay"
    repeat:
      for_each: "{{ alerts }}"
      sequence:
        - variables:
            relay: "{{ repeat.item.relay }}"
            message: "{{ repeat.item.name }} está desligado mas ainda consome {{ repeat.item.power }} W: relé colado?"
        - alias: "Dispatch to each selected mobile device"
          repeat:
            for_each: "{{ notify_devices }}"
            sequence:
              - variables:
                  # `name`, not `name_by_user`: the notify service slug is
                  # frozen at install time and ignores later renames in the UI.
                  mobile_slug: >-
                    {{ (device_attr(repeat.item, 'name')
                        or repeat.item) | slugify }}
              - service: "notify.mobile_app_{{ mobile_slug }}"
                continue_on_error: true
                data:
                  title: "Recife — relé"
                  message: "{{ message }}"
                  # alert_once: the check repeats every five minutes for as
                  # long as the fault lasts, the phone should buzz only once.
                  data: >-
                    {{
                      {
                        'tag': 'reef_relay_' ~ relay,
                        'channel': notify_channel,
                        'alert_once': true
                      } if notify_channel else {
                        'tag': 'reef_relay_' ~ relay,
                        'alert_once': true
                      }
                    }}
